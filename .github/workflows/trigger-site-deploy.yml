# When the site's own subdirectory changes on main, tell
# health-economics-guide.github.io (a separate repo — see its README) to
# redeploy. Scoped to that path, not every push, because most commits here
# are book content that only reaches the live site once someone runs
# `pnpm sync` inside health-economics-guide.github.io/ and commits the
# result; an unrelated chapter edit shouldn't trigger a rebuild of
# unchanged site output.
#
# Requires a write-enabled deploy key on the health-economics-guide.github.io
# repository (its public half), with the private half stored in THIS repo's
# secrets as PAGES_DEPLOY_KEY. A deploy key can only push over SSH — it cannot
# call the workflow-dispatch API, and the default GITHUB_TOKEN cannot reach
# another repo at all — so this workflow pushes an empty commit to that repo's
# main branch instead. That push fires its own `on: push` deploy workflow
# (see health-economics-guide.github.io/.github/workflows/deploy.yml). A push
# made with a deploy key, unlike one made with GITHUB_TOKEN, does trigger
# workflows. The daily schedule there remains the fallback.

name: Trigger site deploy

on:
  push:
    branches: [main]
    paths:
      - 'health-economics-guide.github.io/**'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Push an empty commit to health-economics-guide.github.io
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/pages_deploy_key
          chmod 600 ~/.ssh/pages_deploy_key
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/pages_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
          git clone --depth 1 git@github.com:health-economics-guide/health-economics-guide.github.io.git pages
          cd pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m "Redeploy for health-economics-guide@${SOURCE_SHA::7}"
          git push origin HEAD:main
